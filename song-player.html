<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAS | Song Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&family=Bebas+Neue&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./static/css/song-player.css" />
  </head>

  <body>
    <header class="bar">
      <svg class="eye" viewBox="0 0 64 36" aria-hidden="true">
        <path
          d="M2 18C12 5 24 2 32 2s20 3 30 16C52 31 40 34 32 34S12 31 2 18Z"
          fill="var(--teal)"
        />
        <circle cx="32" cy="18" r="11" fill="var(--red-dark)" />
        <circle cx="32" cy="18" r="5" fill="var(--teal)" />
      </svg>
      <nav aria-label="Main">
        <a href="#">HOME</a><a href="#">ABOUT US</a><a href="#">FACTS</a
        ><a href="#">SETTINGS</a>
      </nav>
      <form class="search" role="search" onsubmit="return false;">
        <input type="search" aria-label="Search songs" id="q" />
        <button type="submit" aria-label="Search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="10" cy="10" r="7" />
            <path d="m15 15 6 6" />
          </svg>
        </button>
      </form>
    </header>

    <main></main>

    <footer class="bar">
      <svg class="eye" viewBox="0 0 64 36" aria-hidden="true">
        <path
          d="M2 18C12 5 24 2 32 2s20 3 30 16C52 31 40 34 32 34S12 31 2 18Z"
          fill="var(--teal)"
        />
        <circle cx="32" cy="18" r="11" fill="var(--red-dark)" />
        <circle cx="32" cy="18" r="5" fill="var(--teal)" />
      </svg>
      <div>Lorem ipsum dolor sit amet consectetur adipiscing elit.</div>
      <small>&copy; 2026 kasgrp6. All rights reserved.</small>
    </footer>

    <script src="./static/js/song-player.js"></script>
  </body>
</html>
