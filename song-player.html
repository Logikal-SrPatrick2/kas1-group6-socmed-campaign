<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAS | Song Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&family=Bebas+Neue&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./static/css/song-player.css" />
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  </head>

  <body>
    <header class="bar">
      <a class="logo" href="./template.html" aria-label="Home"><img src="./static/img/Project_Logo.png" alt="Project logo"></a>
      <nav aria-label="Main">
        <a href="#">ABOUT US</a><a href="#">FACTS</a
        ><a href="#">SETTINGS</a>
      </nav>
      <form class="search" role="search" onsubmit="return false;">
        <input type="search" aria-label="Search songs" id="q" />
        <button type="submit" aria-label="Search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="10" cy="10" r="7" />
            <path d="m15 15 6 6" />
          </svg>
        </button>
      </form>
    </header>

    <main>
      <a class="back" href="./song-selection.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 5l-7 7 7 7" /></svg>
        Back
      </a>

      <div class="player-layout" id="playerLayout">
        <div class="player-column">
          <section class="stage" id="player" aria-label="Song player">
            <div class="turntable">
              <img class="record" id="record" src="" alt="" />
              <img class="cover" id="cover" alt="" />
              <img class="needle" src="./static/img/SongPlayerNeedle.png" alt="" />
            </div>

            <div class="meta">
              <h1 id="title"></h1>
              <p class="artist" id="artist"></p>
            </div>

            <input class="progress" id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />

            <div class="controls">
              <button class="ctl" id="shuffle" type="button" aria-label="Shuffle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" /></svg>
              </button>
              <button class="ctl" id="prev" type="button" aria-label="Previous song">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h3v14H6zM20 5v14L10 12z" /></svg>
              </button>
              <button class="play" id="play" type="button" aria-label="Play">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="playIcon" d="M8 5v14l11-7z" /></svg>
              </button>
              <button class="ctl" id="next" type="button" aria-label="Next song">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 5h3v14h-3zM4 5v14l10-7z" /></svg>
              </button>
              <button class="ctl" id="repeat" type="button" aria-label="Repeat" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" /></svg>
              </button>
            </div>

            <button class="lyrics" id="lyricsBtn" type="button">LYRICS</button>
          </section>

          <aside class="corner">
            <h2>Information:</h2>
            <p class="released">Release date: <span id="released"></span></p>
            <p class="info" id="info"></p>
          </aside>
        </div>
        <aside class="lyrics-panel" id="lyricsPanel" hidden>
          <h2>LYRICS</h2>
          <div class="lyrics-content" id="lyricsContent">
          </div>
        </aside>
      </div>
    </main>

    <footer class="bar">
      <img class="footer-logo" src="./static/img/Project_Logo.png" alt="">
      <div>Lorem ipsum dolor sit amet consectetur adipiscing elit.</div>
      <small>&copy; 2026 kasgrp6. All rights reserved.</small>
    </footer>

    <script src="./static/js/song-player.js"></script>
  </body>
</html>
