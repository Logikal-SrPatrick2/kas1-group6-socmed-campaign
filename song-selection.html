<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAS | Song Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./static/css/song-selection.css">
</head>
<body>

<header class="bar">
  <a class="logo" href="./template.html" aria-label="Home"><img src="./static/img/Project_Logo.png" alt="Project logo"></a>
  <nav aria-label="Main">
    <a href="#">ABOUT US</a><a href="#">FACTS</a><a href="#">SETTINGS</a>
  </nav>
  <form class="search" role="search" onsubmit="return false">
    <input type="search" aria-label="Search songs" id="q">
    <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button>
  </form>
</header>

<main>
  <h1>What do you want to listen to?</h1>

  <div class="carousel" id="carousel" role="listbox" aria-label="Songs">
    <button class="arrow prev" id="prev" aria-label="Previous song"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 5l-7 7 7 7"/></svg></button>
    <button class="arrow next" id="next" aria-label="Next song"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 5l7 7-7 7"/></svg></button>
  </div>

  <div class="info" id="info" aria-live="polite">
    <h2 id="title"></h2>
    <p id="artist"></p>
  </div>
</main>

<footer class="bar">
  <img class="footer-logo" src="./static/img/Project_Logo.png" alt="">
  <div>Lorem ipsum dolor sit amet consectetur adipiscing elit.</div>
  <small>&copy; 2026 kasgrp6. All rights reserved.</small>
</footer>

<script src="./static/js/song-selection.js"></script>
</body>
</html>
