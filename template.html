<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAS | Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./static/css/template.css">
</head>
<body>

<header class="bar">
  <svg class="eye" viewBox="0 0 64 36" aria-hidden="true"><path d="M2 18C12 5 24 2 32 2s20 3 30 16C52 31 40 34 32 34S12 31 2 18Z" fill="var(--teal)"/><circle cx="32" cy="18" r="11" fill="var(--red-dark)"/><circle cx="32" cy="18" r="5" fill="var(--teal)"/></svg>
  <nav aria-label="Main">
    <a href="./home.html">HOME</a><a href="#">ABOUT US</a><a href="#">FACTS</a><a href="#">SETTINGS</a>
  </nav>
  <form class="search" role="search" onsubmit="return false">
    <input type="search" aria-label="Search songs" id="q">
    <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button>
  </form>
</header>

<main>
  <div class="page">

    <section class="banner">
      <img src="./static/img/HOME/Marcos-HOME.png" alt="">
    </section>

    <section class="hero">
      <div class="intro">
        <img class="title" src="./static/img/HOME/MartialLaw-HOME.png" alt="Martial Law">
      </div>

      <div class="panel">

        <div class="top">
          <div class="tiles">
            <a class="tile" href="./song-selection.html" aria-label="Song list">
              <img src="./static/img/HOME/Disc-HOME.png" alt="">
            </a>
            <a class="tile" href="#" aria-label="Playlist">
              <img src="./static/img/HOME/Playlist-HOME.png" alt="">
            </a>
            <a class="tile" href="#" aria-label="Lyrics">
              <img src="./static/img/HOME/Lyrics-HOME.png" alt="">
            </a>
          </div>

          <a class="educated" href="#">
            <img src="./static/img/HOME/Educated-HOME.png" alt="Are you educated enough?">
          </a>
        </div>

        <section class="recent" aria-label="Recently played">
          <img class="recent-bg" src="./static/img/HOME/RecentlyBG-HOME.png" alt="">

          <div class="recent-body">
            <h2 class="recent-label">RECENTLY PLAYED</h2>

            <div class="meta">
              <p class="song">Bayan Ko</p>
              <p class="artist">Freddie Aguilar</p>
            </div>

            <div class="progress" role="progressbar" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="11">
              <span class="knob"></span>
            </div>

            <div class="controls">
              <button type="button" class="ctl" aria-label="Shuffle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
              </button>
              <button type="button" class="ctl" aria-label="Previous">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8z"/><path d="M5 19V5" fill="none" stroke-width="3"/></svg>
              </button>
              <button type="button" class="ctl play" aria-label="Play">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button type="button" class="ctl" aria-label="Next">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14" fill="none" stroke-width="3"/></svg>
              </button>
              <button type="button" class="ctl" aria-label="Repeat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
              </button>
              <button type="button" class="ctl" aria-label="Volume">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" fill="none"/></svg>
              </button>
            </div>
          </div>
        </section>

        <div class="actions">
          <a href="#"><img src="./static/img/HOME/Listen-HOME.png" alt="Listen now"></a>
          <a><img src="./static/img/HOME/SongList-HOME.png" alt="Song list"></a>
        </div>

      </div>
    </section>

  </div>
</main>

<footer class="bar">
  <svg class="eye" viewBox="0 0 64 36" aria-hidden="true"><path d="M2 18C12 5 24 2 32 2s20 3 30 16C52 31 40 34 32 34S12 31 2 18Z" fill="var(--teal)"/><circle cx="32" cy="18" r="11" fill="var(--red-dark)"/><circle cx="32" cy="18" r="5" fill="var(--teal)"/></svg>
  <div>Lorem ipsum dolor sit amet consectetur adipiscing elit.</div>
  <small>&copy; 2026 kasgrp6. All rights reserved.</small>
</footer>

</body>
</html>
